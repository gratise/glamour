name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/glamour_cv/uv.lock
          python-version: '3.12'
      - name: Validate release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH (received: $GITHUB_REF_NAME)." >&2
            exit 1
          fi
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const expected = process.env.GITHUB_REF_NAME.slice(1);
            const files = ["package.json", "apps/cli/package.json", "apps/mcp-server/package.json", "packages/core/package.json", "plugins/glamour/plugin.json", "plugins/glamour/.codex-plugin/plugin.json"];
            for (const file of files) {
              const actual = JSON.parse(readFileSync(file, "utf8")).version;
              if (actual !== expected) throw new Error(`${file} version ${actual} does not match ${expected}`);
            }
          '
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @glamour/core exec playwright install --with-deps chromium
      - run: uv sync --project python/glamour_cv --group dev --frozen
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm validate:agent
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  runtime:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            asset: linux-x64
          - runner: ubuntu-24.04-arm
            asset: linux-arm64
          - runner: macos-15
            asset: macos-arm64
          - runner: macos-15-intel
            asset: macos-x64
          - runner: windows-2025
            asset: windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/glamour_cv/uv.lock
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/package-runtime.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.asset }}
          path: glamour-runtime-${{ github.ref_name }}-${{ matrix.asset }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: runtime
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Package source snapshot
        run: git archive --format=tar.gz --prefix="glamour-${GITHUB_REF_NAME}/" "${GITHUB_SHA}" > "glamour-${GITHUB_REF_NAME}.tar.gz"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "glamour-${GITHUB_REF_NAME}.tar.gz" release-assets/glamour-runtime-*.tar.gz --title "Glamour $GITHUB_REF_NAME" --generate-notes
