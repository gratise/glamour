name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/glamour_cv/uv.lock
          python-version: '3.12'
      - name: Validate release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH (received: $GITHUB_REF_NAME)." >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @glamour/core exec playwright install --with-deps chromium
      - run: uv sync --project python/glamour_cv --group dev --frozen
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Package source snapshot
        run: git archive --format=tar.gz --prefix="glamour-${GITHUB_REF_NAME}/" "${GITHUB_SHA}" > "glamour-${GITHUB_REF_NAME}.tar.gz"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "glamour-${GITHUB_REF_NAME}.tar.gz" --title "Glamour $GITHUB_REF_NAME" --generate-notes
