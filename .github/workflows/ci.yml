name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @glamour/core exec playwright install --with-deps chromium
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/glamour_cv/uv.lock
          python-version: '3.12'
      - run: uv sync --project python/glamour_cv --group dev --frozen
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm validate:agent
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  runtime-packaging:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
          - runner: ubuntu-24.04-arm
          - runner: macos-15
          - runner: macos-15-intel
          - runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: python/glamour_cv/uv.lock
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/package-runtime.mjs
