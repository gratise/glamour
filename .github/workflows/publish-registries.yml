name: Publish MCP package and registry entry

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (without the leading v).
        required: true
        type: string
      publish_npm:
        description: Publish the npm package (leave off after bootstrapping the package).
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-mcp-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Update npm for OIDC publishing
        run: npm install --global npm@latest
      - name: Validate package versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || format('v{0}', inputs.version) }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          test "$(node -p "require('./distribution/npm/package.json').version")" = "$VERSION"
          test "$(node -p "require('./distribution/npm/package.json').mcpName")" = "io.github.gratise/glamour"
          test "$(jq -r .version distribution/npm/server.json)" = "$VERSION"
      - name: Publish npm package with provenance
        if: github.event_name == 'release' || inputs.publish_npm
        working-directory: distribution/npm
        run: npm publish --access public
      - name: Verify manually bootstrapped npm package
        if: github.event_name == 'workflow_dispatch' && !inputs.publish_npm
        env:
          RELEASE_TAG: ${{ format('v{0}', inputs.version) }}
        run: npm view "glamour-mcp@${RELEASE_TAG#v}" version
      - name: Install MCP Registry publisher
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz | tar -xz mcp-publisher
      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish to the official MCP Registry
        working-directory: distribution/npm
        run: ../../mcp-publisher publish server.json
